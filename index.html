<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2B1B5A">
  <meta name="description" content="Don't break the chain: tap to check in every day.">
  <title>Chain</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/LilitaOne-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- Shared star shape, reused via <use href="#star"> -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="star" viewBox="0 0 100 100">
      <polygon points="50,4 62,37 97,38 69,59 79,94 50,74 21,94 31,59 3,38 38,37"
               stroke="#12082B" stroke-width="8" stroke-linejoin="round" />
    </symbol>
  </svg>

  <main id="screens">
    <section class="screen" id="screen-fitness" data-tab="fitness">
      <header class="hud">
        <h1 class="title-plate"><span class="emoji" aria-hidden="true">💪</span>FITNESS</h1>
        <div class="counter" role="status">
          <svg class="star-icon" aria-hidden="true"><use href="#star" /></svg>
          <span class="week-total">0</span>
        </div>
      </header>

      <nav class="week-nav">
        <button class="chunky-btn prev-week" aria-label="Previous week">◀</button>
        <div class="week-label">
          <span class="caption">THIS WEEK</span>
          <span class="range"></span>
          <button class="to-today" hidden>Back to today</button>
        </div>
        <button class="chunky-btn next-week" aria-label="Next week">▶</button>
      </nav>

      <div class="board"></div>
    </section>

    <section class="screen locked" id="screen-diet" data-tab="diet" hidden>
      <div class="locked-card diet"><span class="emoji" aria-hidden="true">🥗</span><h1>DIET</h1><p>Locked · coming soon</p></div>
    </section>

    <section class="screen locked" id="screen-money" data-tab="money" hidden>
      <div class="locked-card money"><span class="emoji" aria-hidden="true">💰</span><h1>MONEY</h1><p>Locked · coming soon</p></div>
    </section>
  </main>

  <nav class="tab-bar" role="tablist">
    <button role="tab" data-tab="fitness" class="tab fitness"><span class="emoji" aria-hidden="true">💪</span>FITNESS</button>
    <button role="tab" data-tab="diet" class="tab diet"><span class="emoji" aria-hidden="true">🥗</span>DIET</button>
    <button role="tab" data-tab="money" class="tab money"><span class="emoji" aria-hidden="true">💰</span>MONEY</button>
  </nav>
</body>
</html>
